<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Site oficial da Stunks Apps.">
  <link rel="icon" href="assets/livre-hoje.webp" type="image/webp">
  <title>Stunks Apps</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101218; color: #f2f2f2; }
    main { max-width: 720px; margin: 0 auto; padding: 72px 24px; }
    h1 { font-size: clamp(2.4rem, 8vw, 4.5rem); margin: 0 0 12px; }
    h2 { margin: 0 0 8px; }
    p { color: #c8cad0; font-size: 1.1rem; line-height: 1.7; }
    a { color: #95c5ff; }
    .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
    .card { display: grid; grid-template-columns: 88px 1fr; gap: 20px; align-items: start; padding: 24px; border: 1px solid #30343e; border-radius: 16px; background: #181b22; }
    .app-icon { width: 88px; height: 88px; border-radius: 22px; object-fit: cover; }
    .card p { margin: 0 0 12px; font-size: 1rem; }
    footer { margin-top: 56px; color: #9296a1; font-size: .95rem; }
    @media (max-width: 420px) { .card { grid-template-columns: 64px 1fr; } .app-icon { width: 64px; height: 64px; border-radius: 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>Stunks Apps</h1>
    <p>Aplicativos Android simples, úteis e respeitosos com os dados das pessoas.</p>

    <section class="apps" aria-label="Aplicativos publicados">
      <article class="card">
        <img class="app-icon" src="assets/livre-hoje.webp" alt="Ícone do Livre Hoje" width="88" height="88">
        <div>
          <h2>Livre Hoje</h2>
          <p>Um aplicativo para acompanhar compromissos pessoais e mudanças de hábitos, um dia de cada vez.</p>
          <p>
            <a href="https://play.google.com/store/apps/details?id=com.stunks.livrehoje">Google Play</a>
            ·
            <a href="https://github.com/costa-dnl/livre-hoje-content/blob/main/PRIVACY.md">Privacidade</a>
          </p>
        </div>
      </article>
    </section>

    <footer>
      Contato: <a href="mailto:dev.costadnl@gmail.com">dev.costadnl@gmail.com</a>
    </footer>
  </main>
</body>
</html>
